name: Build FishMoney EXE

# workflow_dispatch：手动触发；push tags v*：自动发布到 Releases
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    name: Test & build on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      # --add-data：把 app.ico 打进 exe，托盘图标才不会退化为占位图
      - name: Build with PyInstaller
        run: pyinstaller --onefile --noconsole --clean --icon="app.ico" --add-data "app.ico;." --name "FishMoney" fish.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishMoney-Release
          path: dist/FishMoney.exe
          retention-days: 5

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FishMoney.exe
